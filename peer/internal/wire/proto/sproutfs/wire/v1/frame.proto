edition = "2024";

package sproutfs.wire.v1;

import "google/protobuf/any.proto";

option go_package = "github.com/semistrict/sproutfs/peer/internal/gen/sproutfs/wire/v1;wirev1";

// Envelope is the protobuf portion of an internode frame. Large bulk data is
// carried in the adjacent raw payload described by payload.
message Envelope {
  uint32 wire_version = 1;
  fixed64 request_id = 2;
  fixed64 in_reply_to = 3;
  google.protobuf.Any message = 4;
  PayloadDescriptor payload = 5;
  // header_checksum is the CRC32C of every byte of the encoded envelope before
  // it, and it is always the last field: the encoder appends it to what it
  // encoded. A frame of wire version 2 carries it; version 1 frames may. A
  // decoder of version 1 that predates it skips it as an unknown field.
  fixed32 header_checksum = 6;
}

message PayloadDescriptor {
  uint64 length = 1;
  ChecksumAlgorithm checksum_algorithm = 2;
  bytes checksum = 3;
}

enum ChecksumAlgorithm {
  CHECKSUM_ALGORITHM_UNSPECIFIED = 0;
  CHECKSUM_ALGORITHM_CRC32C = 1;
  CHECKSUM_ALGORITHM_SHA256 = 2;
}
