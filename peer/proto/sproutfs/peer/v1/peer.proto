edition = "2024";

package sproutfs.peer.v1;

option go_package = "github.com/semistrict/sproutfs/peer/internal/gen/sproutfs/peer/v1;peerv1";

// Status is how a peer server answered a request of this package. The page
// requests of sproutfs.migrate.v1 keep their own.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  // STATUS_INCOMPATIBLE answers a hello whose range shares no version with
  // the server's. It is its own outcome: the peer is neither down nor gone.
  STATUS_INCOMPATIBLE = 2;
}

// Class is the kind of traffic a connection carries. A server keeps a budget
// of bytes per peer and class, so bulk work never takes what a fault needs.
enum Class {
  CLASS_UNSPECIFIED = 0;
  CLASS_FAULT = 1;
  CLASS_BULK_READ = 2;
  CLASS_BULK_WRITE = 3;
  // CLASS_STRIPE is a read of the cluster's disk cache that a fault waits
  // on. Its replies are small and many, so they never share a connection
  // with the fault class's 2 MiB pages, whose replies they would wait
  // behind. A server of a release before it reads it as CLASS_FAULT.
  CLASS_STRIPE = 4;
}

// Hello is the first frame a dialer sends on a connection of protocol 2 or
// later, encoded at wire version 2 whatever range it states, so a server of
// any later release reads it. A connection whose first frame is not a hello
// speaks protocol 1, which the release before this one spoke.
message Hello {
  // min_version and max_version are the protocol versions the dialer speaks.
  uint32 min_version = 1;
  uint32 max_version = 2;
  // class is the traffic every request on this connection is counted as.
  Class class = 3;
}

// HelloReply answers a hello with the version both ends use from here on, or
// with STATUS_INCOMPATIBLE and the server's own range. Every later frame on
// the connection is encoded at the chosen version.
message HelloReply {
  Status status = 1;
  uint32 version = 2;
  uint32 min_version = 3;
  uint32 max_version = 4;
  // budget_bytes is what this connection's class of this peer may hold at the
  // server at once, over every connection of that class. A peer that asks for
  // no more is answered BUSY only when the server is short itself.
  uint64 budget_bytes = 5;
  // max_in_flight is how many requests this connection may carry at once.
  uint32 max_in_flight = 6;
}

// Busy answers a request the server would have to hold more than its budget
// for. Nothing is wrong with either end, and nothing was done: the request may
// be made again. It says how busy the server is for this peer and class, so a
// peer that has nowhere else to go waits about as long as that takes.
message Busy {
  Class class = 1;
  // held_bytes is what this peer's requests of the class hold now, and
  // budget_bytes what they may; asked_bytes is what the refused request needed.
  uint64 held_bytes = 2;
  uint64 budget_bytes = 3;
  uint64 asked_bytes = 4;
}

// Ping asks the server to show it is there. It is answered with a Pong as soon
// as it is read, never queued behind a request, so a connection busy with large
// replies or slow ones still shows its peer is alive.
message Ping {}

// Pong answers a Ping.
message Pong {}

// The requests of the cluster's disk cache. Every one names the disk it
// expects to reach, by its identity, and the generation of the membership its
// sender routed it by. A host answers only under that generation: one behind
// reads the membership first, and one ahead, or one that cannot read it,
// answers CACHE_STATUS_STALE with its own. A host the membership does not
// have serve the disk named answers CACHE_STATUS_NOT_ME: an address can come
// to belong to another host, and a disk to another member. Every answer of a
// disk names the generation that assigned it to the member answering.

// CacheStatus is how a cache answered.
enum CacheStatus {
  CACHE_STATUS_UNSPECIFIED = 0;
  CACHE_STATUS_OK = 1;
  // CACHE_STATUS_NOT_ME answers a request naming another cache than this
  // host's, or a host that keeps no cache.
  CACHE_STATUS_NOT_ME = 2;
  // CACHE_STATUS_DROPPED answers a keep the cache did not write: it holds the
  // stripe already, or its budget for writes is spent. Nothing waits on a
  // keep, so it is dropped rather than queued.
  CACHE_STATUS_DROPPED = 3;
  // CACHE_STATUS_STALE answers a request under another generation of the
  // membership than the host holds, which the answer names: its sender is
  // behind and reads the membership again, or the host is behind and could
  // not read it.
  CACHE_STATUS_STALE = 4;
}

// Window is the unit of placement: the pages of one volume, in one aligned
// 2 MiB span, that one checkpoint published, or one segment of its page table.
message Window {
  string vm = 1;
  uint64 sequence = 2;
  string volume = 3;
  bool segment = 4;
  uint64 number = 5;
  // pages is how many pages of its volume the window spans: one for a
  // segment and at a 2 MiB page, 512 at 4 KiB. A window's pages are counted
  // from its first.
  uint32 pages = 6;
}

// StripeItem is one stripe a frame's payload carries: the page of the window
// it belongs to, its index in the code, the length of the envelope it was cut
// from, and its size in the payload. The items lie in the payload in order.
// A stripe is stored as it goes on the wire, with a checksum of its own, so a
// frame that carries stripes carries no checksum of its payload.
message StripeItem {
  uint32 page = 1;
  uint32 index = 2;
  uint32 length = 3;
  uint32 size = 4;
}

// ReadStripes asks a cache for every stripe it holds of the pages of one
// window, of any index of the code.
message ReadStripes {
  bytes cache = 1;
  Window window = 2;
  // pages is a bitmap of the pages of the window wanted, least significant
  // bit of byte 0 first; empty asks for every page.
  bytes pages = 3;
  uint32 k = 4;
  uint32 m = 5;
  // max_bytes is the most the reply may carry.
  uint64 max_bytes = 6;
  uint64 generation = 7;
}

// Stripes answers ReadStripes with the stripes the cache holds, which may be
// none. fill_right gives the reader the right to fill a window this cache
// ranks first for and holds nothing of.
message Stripes {
  CacheStatus status = 1;
  repeated StripeItem items = 2;
  bool fill_right = 3;
  // generation is the membership's the host answered under, and assigned
  // the generation that assigned it the disk.
  uint64 generation = 4;
  uint64 assigned = 5;
}

// Keep asks a cache to write the stripes its payload carries. A repair is the
// lowest of every write; a fill from a publication is kept longest when the
// cache's write budget runs low, and one from a read of the store before it.
message Keep {
  bytes cache = 1;
  Window window = 2;
  uint32 k = 3;
  uint32 m = 4;
  repeated StripeItem items = 5;
  bool repair = 6;
  bool publication = 7;
  uint64 generation = 8;
}

// Kept answers a Keep: written, or dropped.
message Kept {
  CacheStatus status = 1;
  uint64 generation = 2;
  uint64 assigned = 3;
}

// Drop tells a cache to forget one stripe a reader found wrong.
message Drop {
  bytes cache = 1;
  Window window = 2;
  uint32 page = 3;
  uint32 index = 4;
  uint32 k = 5;
  uint32 m = 6;
  uint64 generation = 7;
}

// Dropped answers a Drop.
message Dropped {
  CacheStatus status = 1;
  uint64 generation = 2;
  uint64 assigned = 3;
}

// Presence asks which stripes of some windows a cache holds, under one code.
message Presence {
  bytes cache = 1;
  repeated Window windows = 2;
  uint32 k = 3;
  uint32 m = 4;
  uint64 generation = 5;
}

// Present answers Presence. For each window, in the order the windows were
// asked, and for each index of the code, in index order, held carries a bitmap
// of the pages of the window the cache holds that index of. A page counts as
// held only with k distinct indices, so a bitmap of pages alone could not say.
message Present {
  reserved 2;
  reserved pages;
  CacheStatus status = 1;
  uint64 generation = 3;
  uint64 assigned = 4;
  repeated bytes held = 5;
}

// Probe asks whether this host is there and keeps the disk named. An empty
// cache asks only whether the host is there.
message Probe {
  bytes cache = 1;
}

// Probed answers a Probe with the identity of the disk this host keeps, empty
// for a host that keeps none.
message Probed {
  CacheStatus status = 1;
  bytes cache = 2;
}

// JournalStatus is how a host answered a read of a journal disk.
enum JournalStatus {
  JOURNAL_STATUS_UNSPECIFIED = 0;
  JOURNAL_STATUS_OK = 1;
  // JOURNAL_STATUS_NOT_HERE: the host holds no journal disk of that identity.
  JOURNAL_STATUS_NOT_HERE = 2;
  // JOURNAL_STATUS_GENERATION: the disk was formatted again, and the entries
  // asked for are gone.
  JOURNAL_STATUS_GENERATION = 3;
}

// JournalRead asks the holder of a journal disk for one VM's entries of one
// epoch after a position: JOURNAL_READ (plans/fsync-journal-2026-10-06.md).
// The holder first fences the VM at reader, so no entry of an older epoch is
// placed from then on, and gives the VM up if it runs it.
message JournalRead {
  bytes disk = 1;
  string vm = 2;
  uint64 epoch = 3;
  uint64 after = 4;
  uint64 generation = 5;
  uint64 reader = 6;
  uint64 max_bytes = 7;
}

// JournalEntries answers JournalRead with entries in position order, their
// blocks in the payload in that order. more says the reader asks again after
// the last entry's position.
message JournalEntries {
  JournalStatus status = 1;
  repeated JournalEntry entries = 2;
  bool more = 3;
}

// JournalEntry is one entry of JournalEntries: its position, the volume its
// blocks are of, and their numbers.
message JournalEntry {
  uint64 position = 1;
  string volume = 2;
  repeated uint64 blocks = 3;
}
