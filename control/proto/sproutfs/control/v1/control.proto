edition = "2024";

package sproutfs.control.v1;

option go_package = "github.com/semistrict/sproutfs/control/internal/gen/sproutfs/control/v1;controlv1";

// Record is the one mutable durable object a VM owns. It selects the checkpoint
// the VM's state is, names the writer that may replace it, lists the
// checkpoints of it that have been forked and the ones a checkpoint request
// kept, none of which may be reclaimed, and names the journals that may hold
// its flushed writes newer than the selected checkpoint.
message Record {
  uint32 format_version = 1;
  string vm_id = 2;
  // epoch is the writer token. Every open advances it, which fences the writer
  // that held the previous one.
  uint64 epoch = 3;
  // writer_nonce is chosen at random by the writer that took this epoch, so
  // a writer whose conditional write lost its reply can re-read the record and
  // recognise its own.
  bytes writer_nonce = 4;
  // selected is the sequence of the checkpoint this VM's durable state is.
  uint64 selected = 5;
  // Field 6 held bare pinned sequences, 8 the pins that named their holders, 9
  // and 10 the parent checkpoint a record held one of those on, and 11 the
  // tombstone a delete left while holders remained.
  reserved 6, 8, 9, 10, 11;
  // created reports that the selected checkpoint's index object has been
  // published. A fork's record selects its root before that index exists.
  bool created = 7;
  // pinned lists the checkpoints of this VM that have been forked, in ascending
  // order of sequence. A pinned checkpoint's objects are never reclaimed, and
  // nothing here unpins one: a pin is what a collector releases once it has
  // established that no descendant reads through it.
  repeated uint64 pinned = 12;
  // kept lists the checkpoints of this VM a checkpoint request kept, in
  // ascending order of sequence. A kept checkpoint's objects are never
  // reclaimed. A kept checkpoint no fork was taken from may be released.
  repeated Kept kept = 13;
  // journals lists the journals that may hold this VM's flushed writes newer
  // than the selected checkpoint, in ascending order of epoch. A recovery
  // replays them in that order. A selection writes the list, an open keeps it,
  // and a migration's open adds the destination's journal.
  repeated Journal journals = 14;
}

// Kept is one checkpoint a checkpoint request kept: its sequence, when it was
// selected, and whether it holds VMM state.
message Kept {
  uint64 sequence = 1;
  // time is when the checkpoint was selected, in nanoseconds since the Unix
  // epoch.
  int64 time = 2;
  // state reports that the checkpoint holds VMM state, so a fork of it resumes
  // the guest rather than booting it.
  bool state = 3;
}

// Journal names one journal that may hold a VM's flushed writes newer than its
// selected checkpoint.
message Journal {
  // disk is the identity of the journal's disk, 16 bytes.
  bytes disk = 1;
  // generation is the one drawn when the disk was formatted. A disk formatted
  // again holds none of the entries the record names.
  uint64 generation = 2;
  // epoch is the VM's writer epoch whose entries the journal holds.
  uint64 epoch = 3;
  // covered is the last position whose entries the selected checkpoint holds.
  // A replay applies only the entries after it.
  uint64 covered = 4;
}
