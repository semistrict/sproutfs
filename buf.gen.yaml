version: v2

inputs:
  - directory: checkpoint/proto
  - directory: control/proto
  - directory: platform/proto
  - directory: vmmigrate/proto
  - directory: vmmigrate/internal/wire/proto

plugins:
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go
    out: .
    opt:
      - module=github.com/semistrict/sproutfs
      - default_api_level=API_OPAQUE
