# The hosts that run VMs. Two pods on the demo's single node; the node's 4 GiB
# HugeTLB pool is split evenly between them, so both hold their PMEM arenas at
# once and a migration has somewhere to go. A host's RAM arena is ordinary
# memory now, charged to the pod's own request rather than to the pool.
# deploy/README.md documents every name below.
apiVersion: v1
kind: Service
metadata:
  name: sproutfs-host
  namespace: sproutfs
  labels:
    app.kubernetes.io/name: sproutfs-host
    app.kubernetes.io/part-of: sproutfs
spec:
  # Headless: the orchestrator and the hosts address one another per pod, not
  # through a virtual address that would pick a host at random.
  clusterIP: None
  selector:
    app.kubernetes.io/name: sproutfs-host
  ports:
    - name: api
      port: 8080
      targetPort: api
    - name: page
      port: 8081
      targetPort: page
---
# A Deployment: nothing here needs a pod to come back as itself. A host imports
# each guest image into a template — an ordinary VM whose checkpoint holds the
# image, so that creating a VM is a fork of it — under an identity that is the
# sha256 of the image file, so the two pods name one template between them,
# import it once and only if it is not there, and a replacement pod finds it
# published and imports nothing at all. Pod names carry a suffix of the
# Deployment's own choosing and nothing depends on them.
#
# The rollout is one pod at a time, the old one gone before its replacement
# starts: the two pods together request the whole HugeTLB pool and three
# quarters of the node's memory, so there is no room on the node for a third,
# and the other pod has to stay up while one is replaced — which is what the
# preStop drain needs, a destination to migrate its VMs to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sproutfs-host
  namespace: sproutfs
  labels:
    app.kubernetes.io/name: sproutfs-host
    app.kubernetes.io/part-of: sproutfs
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # No surge and one unavailable: the replacement starts only once the pod
      # it replaces has given its allotment back, and the other pod is up
      # throughout, which is where the drained VMs go.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sproutfs-host
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sproutfs-host
        app.kubernetes.io/part-of: sproutfs
    spec:
      # The grace period is the preStop hook plus the shutdown behind it. The
      # hook migrates every VM away — the drain bounds itself at 30 min,
      # including the wait for each destination to report that it holds the
      # pages, and the command waiting on it gives up at 31 min. Then SIGTERM:
      # the API stops within 30 s and the supervisor's close within another
      # 30 s, publishing a final checkpoint of every VM that did not move.
      # Thirty-one minutes and one is this 1920 s; a grace period shorter than
      # drain plus shutdown kills the pod with pages no checkpoint has.
      terminationGracePeriodSeconds: 1920
      containers:
        - name: host
          image: sproutfs:demo
          # The image is imported into the node's containerd, never pulled.
          imagePullPolicy: Never
          command: ["/usr/local/bin/sproutfs-host"]
          securityContext:
            privileged: true
          ports:
            - name: api
              containerPort: 8080
            - name: page
              containerPort: 8081
          env:
            - name: SPROUTFS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: sproutfs-demo
                  key: bucket
            - name: SPROUTFS_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: sproutfs-demo
                  key: prefix
            - name: SPROUTFS_API_PORT
              value: "8080"
            - name: SPROUTFS_PAGE_SERVER_PORT
              value: "8081"
            - name: SPROUTFS_HUGEPAGE_DIR
              value: /hugepages-2Mi
            - name: SPROUTFS_SCRATCH_DIR
              value: /var/lib/sproutfs
            # The page cache's disk, in a node directory that outlives the
            # pod. The host takes the first file there, cache-0, cache-1 and
            # so on, that no other host holds, so the two pods on this node
            # never share one, and a replaced pod takes a file back with what
            # it holds. It is on the same filesystem as the scratch, which the
            # host checks: one disk limiter measures one filesystem.
            - name: SPROUTFS_CACHE_DIR
              value: /var/cache/sproutfs
            # The pager's page store and the RAM allotment it takes its pages
            # from. The share below gives RAM three quarters of it — 3.75 GiB
            # — and PMEM the rest, 1.25 GiB, both 2 MiB pages out of the pod's
            # 6Gi HugeTLB allotment. A workload
            # guest is 2 GiB and its forks share what they have not diverged
            # from, so an arena of 5 GiB is what keeps a handful of them
            # resident rather than reading one another out of the spill file.
            - name: SPROUTFS_ARENA_BYTES
              value: "5368709120"
            # How each pager divides its resident pages between files: shared,
            # or isolated, which gives each VMM only its own VM's memory and its
            # tenant's shared pages. scripts/demo-gce.sh writes it into the
            # ConfigMap from SPROUTFS_DEMO_ARENA; a cluster without the key runs
            # the host's default, isolated.
            - name: SPROUTFS_ARENA
              valueFrom:
                configMapKeyRef:
                  name: sproutfs-demo
                  key: arena
                  optional: true
            - name: SPROUTFS_MEMORY_BYTES
              value: "12884901888"
            # The page cache's own allotment, which is memory.
            - name: SPROUTFS_CACHE_BYTES
              value: "1073741824"
            # The pagers' spill files, allocated whole when the host starts.
            - name: SPROUTFS_SPILL_BYTES
              value: "17179869184"
            # One disk limiter bounds everything the host writes: the spill
            # files, VMM staging and the page cache's disk. The cache takes
            # what the goals leave. A fifth of the filesystem stays free,
            # above the kubelet's eviction and image collection marks. Each
            # host holds at most 56 GiB, so the two pods on this node split
            # the disk rather than the first cache taking all of it. The
            # node's 200 GB disk leaves about 45 GiB for everything else.
            - name: SPROUTFS_DISK_FREE_PERCENT
              value: "20"
            - name: SPROUTFS_DISK_USED_BYTES
              value: "60129542144"
            # The cache's write budget, counted on the disk's own write
            # counter. A persistent disk has no rated endurance, so this is
            # a ceiling the demo should never meet: about five writes of the
            # whole disk a day, a burst of an hour's worth.
            - name: SPROUTFS_CACHE_WRITE_BYTES_PER_DAY
              value: "1099511627776"
            # The cluster cache is off: every window is kept whole on the
            # host that reads it, whatever the list of caches says, until
            # hosts read stripes from each other.
            - name: SPROUTFS_CACHE_CLUSTER_PERCENT
              value: "0"
            # The ephemeral disks this host admits, as a spill file of their
            # own out of the same emptyDir: every host sets it, because a VM
            # with one may be opened, received or recovered on either. Its
            # resident pages take 256 MiB of the HugeTLB allotment, beside the
            # 5 GiB arena.
            - name: SPROUTFS_EPHEMERAL_BYTES
              value: "2147483648"
            # The volatile private state each pager may hold in its arena and
            # its spill file together, counted in that pager's own page, which
            # is 2 MiB for both. Each defaults to its share of the arena, which is what a
            # guest whose dirty set never outruns the arena needs; a workload
            # guest writing hundreds of megabytes between checkpoints, with
            # forks doing the same beside it, outruns that long before the spill
            # file is full. The two are 12 GiB divided as the arena is, three
            # quarters to RAM: 9 GiB and 3 GiB of 2 MiB pages.
            - name: SPROUTFS_RAM_DIRTY_PAGES
              value: "4608"
            - name: SPROUTFS_PMEM_DIRTY_PAGES
              value: "1536"
            # The guest images a VM can be created from, on the node's own
            # disk, and the shape of every VM booted from one. A template may
            # name the RAM its VMs get after a colon; workload carries repos
            # and a Node toolchain and needs more than the 512 MiB default.
            - name: SPROUTFS_TEMPLATES
              value: alpine=/usr/share/sproutfs/guest/guest.ext4,workload=/usr/share/sproutfs/guest/workload.ext4:2147483648
            - name: SPROUTFS_VM_MEMORY_BYTES
              value: "536870912"
            - name: SPROUTFS_VM_VCPUS
              value: "1"
            # How often every VM this host runs is checkpointed, which bounds
            # what killing this pod rewinds a guest by.
            - name: SPROUTFS_CHECKPOINT_INTERVAL
              value: 60s
            - name: SPROUTFS_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The pod's own name, which is what this host reports itself to the
            # orchestrator as and what an operator addresses it by. Nothing
            # durable is named after it: a template is named by its guest
            # image's bytes, which is why these pods need no stable names.
            - name: SPROUTFS_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPROUTFS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Where a drain asks for somewhere to put its VMs and reports what
            # it is doing with each of them, which is the orchestrator's own
            # Service.
            - name: SPROUTFS_ORCHESTRATOR_URL
              value: http://sproutfs-orchestrator.sproutfs.svc:8080
            # The deployment's shared bearer token. One token admits the whole
            # control plane — the orchestrator to the hosts, a draining host to
            # the orchestrator, and sproutfsctl to either — and nothing else
            # reaches these APIs. It is generated per deployment by
            # scripts/demo-gce.sh, so a pod without the Secret does not start
            # rather than serving an API that admits anyone.
            - name: SPROUTFS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sproutfs-api-token
                  key: token
            # Go's own ceiling, under the container's. Without it the collector
            # has no reason to run before the cgroup kills the process, and a
            # checkpoint that plans a large dirty set is exactly the burst that
            # outruns it.
            - name: GOMEMLIMIT
              value: "6GiB"
          resources:
            # The HugeTLB allotment is both arenas, 5 GiB of them with room
            # over. The ordinary memory beside it holds the Go heap, the page
            # cache, one Firecracker process per VM and the page cache of the
            # spill file. A checkpoint plans every page it is about to upload
            # in memory at once, so the peak scales with the dirty set, which
            # is what a guest that installs a few hundred megabytes between
            # checkpoints makes large: two pods of 8 GiB fit inside the node's
            # 32 GiB with its 12 GiB HugeTLB pool taken out.
            requests:
              cpu: "2"
              memory: 8Gi
              hugepages-2Mi: 6Gi
            limits:
              cpu: "3"
              memory: 8Gi
              hugepages-2Mi: 6Gi
          lifecycle:
            # Drain before the process is signalled: migrate every VM to the
            # other host and return only when none are left to hand over. It is
            # an exec rather than an httpGet because the drain is a POST
            # carrying the deployment's token, and an httpGet hook can be
            # neither; the command reaches this container's own API over the
            # loopback with the environment the server was started with.
            preStop:
              exec:
                command: ["/usr/local/bin/sproutfs-host", "drain"]
          # A starting host is not ready until every guest image it is
          # configured with has a published template: a create that landed on a
          # host still importing would wait that out inside the request. An
          # image nothing has imported yet costs a read of the whole file and a
          # checkpoint of it; one another pod has already imported costs a read
          # of one control record. The startup probe gives the first of those
          # its time. Nothing else runs until it passes, so the two probes below
          # are about a host that is running rather than one that is still
          # reading images, and neither has to be generous.
          startupProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 5
            failureThreshold: 3
          # Liveness is the other question: the process can still do the work it
          # exists for. It is a separate endpoint so that a host doing an honest
          # import is not restarted for failing readiness, which is what one
          # probe on one path would do, and it answers 503 once the supervisor
          # has closed — a pod that has released its pager and its VMM processes
          # can serve nothing, and one that went on answering would be left
          # running for ever.
          livenessProbe:
            httpGet:
              path: /livez
              port: api
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: kvm
              mountPath: /dev/kvm
            - name: hugepages
              mountPath: /hugepages-2Mi
            - name: scratch
              mountPath: /var/lib/sproutfs
            # One directory per namespace, so a second deployment on the
            # node never takes this one's cache files.
            - name: cache
              mountPath: /var/cache/sproutfs
              subPathExpr: $(SPROUTFS_NAMESPACE)
            - name: guest
              mountPath: /usr/share/sproutfs/guest
              readOnly: true
      volumes:
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        # The pod's share of the node's 2 MiB pool, as a hugetlbfs mount the
        # PMEM pager can open its arena in. The RAM pager opens an ordinary
        # memfd and does not touch the pool.
        - name: hugepages
          emptyDir:
            medium: HugePages-2Mi
        # The spill files and the VMM scratch, on the node's own disk and
        # discarded with the pod: a restart is a host loss for them. No size
        # limit: the disk limiter bounds what the host writes, and a kubelet
        # limit would evict the pod, a host loss, where the limiter refuses a
        # promise.
        - name: scratch
          emptyDir: {}
        # The page cache's disk, on the node's own disk like the scratch, but
        # outliving the pod: it holds only copies of what the bucket holds,
        # each under a name that never names other bytes, so a replaced pod
        # reads it back. A hostPath, not a local PersistentVolume: a claim
        # would pin the pod to this node, and a pod that moves to another
        # node should start there with whatever cache that node has, not
        # wait for this one. A file another deployment wrote is emptied when
        # a host opens it.
        - name: cache
          hostPath:
            path: /opt/sproutfs-demo/cache
            type: DirectoryOrCreate
        # The guest image is built on the node by scripts/lib/demo-image.sh, not
        # baked into the container image, so the pods read it from the node.
        # DirectoryOrCreate so that a pod still starts before the build has run.
        - name: guest
          hostPath:
            path: /opt/sproutfs-demo/guest
            type: DirectoryOrCreate
---
# What a voluntary disruption may take at once. Draining a host migrates its VMs
# to the other one, so an eviction that took both pods together — a node drain, a
# cluster upgrade — would leave every drain with nowhere to go and turn a planned
# operation into a host loss for every VM in the deployment. One at a time is
# also all the node has room for: the two pods request the whole HugeTLB pool
# and most of the node's memory between them, so a replacement cannot start
# until its predecessor is gone.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sproutfs-host
  namespace: sproutfs
  labels:
    app.kubernetes.io/name: sproutfs-host
    app.kubernetes.io/part-of: sproutfs
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sproutfs-host
