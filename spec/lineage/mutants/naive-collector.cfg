\* A collector that releases a pin no record's selected checkpoint reads
\* deletes what a fork in flight is about to read: the pin landed before the
\* scan and the child's record after it. TASK-24 must not be built this way.
\* expect: NoDanglingRead
SPECIFICATION Spec
INVARIANT NoDanglingRead
CHECK_DEADLOCK FALSE
CONSTANTS
    Root = p
    Child = c
    Grandchild = g
    MaxCkpts = 1
    Collector = "naive"
    Deleting = TRUE
    Bugs = {}
