\* A sweep that deletes another VM's checkpoints, which a fork's root names.
\* expect: NoDanglingRead
SPECIFICATION Spec
INVARIANT NoDanglingRead
CHECK_DEADLOCK FALSE
CONSTANTS
    Root = p
    Child = c
    Grandchild = g
    MaxCkpts = 1
    Collector = "none"
    Deleting = TRUE
    Bugs = {"sweep-other-vms"}
