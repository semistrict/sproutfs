\* A collector with holders that judges a holder by its state when it
\* releases, not by what its scan saw: a root that lands between the two is
\* in neither. TASK-24 must judge holders by its own scan.
\* expect: NoDanglingRead
SPECIFICATION Spec
INVARIANT NoDanglingRead
CHECK_DEADLOCK FALSE
CONSTANTS
    Root = p
    Child = c
    Grandchild = g
    MaxCkpts = 1
    Collector = "holders-late"
    Deleting = TRUE
    Bugs = {}
