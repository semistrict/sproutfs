\* A delete that spares no pin, which a child reads through.
\* expect: NoDanglingRead
SPECIFICATION Spec
INVARIANT NoDanglingRead
CHECK_DEADLOCK FALSE
CONSTANTS
    Root = p
    Child = c
    Grandchild = g
    MaxCkpts = 1
    Collector = "none"
    Deleting = TRUE
    Bugs = {"delete-forgets-pins"}
