\* Three hosts whose deployment changes its code on purpose, from 2+1 to
\* 1+1, while a host may crash or leave, a peer may answer with a wrong
\* stripe, and a stripe may be evicted. A window stored under 2+1 stays
\* readable under it after the change.
SPECIFICATION Spec
INVARIANTS NoWrongBytes StripesRanked SurvivesLosses
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2, 3}
    Founders = {1, 2, 3}
    K = 2
    M = 1
    NextK = 1
    NextM = 1
    Spans = {1}
    Epochs = {1}
    Values = {1}
    MaxGens = 1
    MaxReads = 3
    MaxChanges = 1
    Faults = {"answer", "evict"}
    MaxFaults = 1
    Bugs = {}
