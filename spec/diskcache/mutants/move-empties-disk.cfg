\* A shard that moves loses its stripes, as a cache on a host's own disk does
\* when the host goes: a window's stripes are not all readable once every
\* shard serves again.
\* expect: MovesKeepStripes
SPECIFICATION Spec
INVARIANTS NoWrongBytes StripesRanked SurvivesLosses MovesKeepStripes
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2, 3}
    Founders = {1, 2, 3}
    K = 2
    M = 1
    NextK = 0
    NextM = 0
    Spans = {1, 2}
    Epochs = {1}
    Values = {1}
    MaxGens = 1
    MaxReads = 2
    MaxChanges = 0
    Faults = {"move"}
    MaxFaults = 0
    Bugs = {"move-empties-disk"}
