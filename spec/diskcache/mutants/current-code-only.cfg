\* A read that tries only its list's code, and takes a window stored under
\* the code before it for a miss. Once the deployment changes its code from
\* 2+1 to 1+1, a window whose three 2+1 stripes are all readable no longer
\* decodes for any reader.
\* expect: SurvivesLosses
SPECIFICATION Spec
INVARIANTS NoWrongBytes StripesRanked SurvivesLosses
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2, 3}
    Founders = {1, 2, 3}
    K = 2
    M = 1
    NextK = 1
    NextM = 1
    Spans = {1}
    Epochs = {1}
    Values = {1}
    MaxGens = 1
    MaxReads = 3
    MaxChanges = 1
    Faults = {"answer", "evict"}
    MaxFaults = 1
    Bugs = {"current-code-only"}
