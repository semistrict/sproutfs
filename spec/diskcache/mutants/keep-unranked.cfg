\* that has not yet read the list with the fourth host sends a stripe to a
\* host that list pushed out of the window's ranks.
\* expect: StripesRanked
SPECIFICATION Spec
INVARIANTS NoWrongBytes StripesRanked SurvivesLosses
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2, 3, 4}
    Founders = {1, 2, 3}
    K = 2
    M = 1
    NextK = 0
    NextM = 0
    Spans = {1, 2}
    Epochs = {1}
    Values = {1}
    MaxGens = 1
    MaxReads = 2
    MaxChanges = 1
    Faults = {"answer", "evict"}
    MaxFaults = 1
    Bugs = {"keep-unranked"}
