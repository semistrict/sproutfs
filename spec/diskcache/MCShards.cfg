\* Three shards under 2+1 that move between hosts without bound while the
\* checkpoint publishes and is read, as compute scales: every window stays
\* readable, and every stripe comes back with its shard.
SPECIFICATION Spec
INVARIANTS NoWrongBytes StripesRanked SurvivesLosses MovesKeepStripes
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2, 3}
    Founders = {1, 2, 3}
    K = 2
    M = 1
    NextK = 0
    NextM = 0
    Spans = {1, 2}
    Epochs = {1}
    Values = {1}
    MaxGens = 1
    MaxReads = 2
    MaxChanges = 0
    Faults = {"move"}
    MaxFaults = 0
    Bugs = {}
