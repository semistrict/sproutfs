\* MCWrap with two changes to the list: two hosts may go, or one leave and
\* join again with an empty disk.
\* Exhaustive, and a minute long. Run by just check-spec-deep.
SPECIFICATION Spec
INVARIANTS NoWrongBytes StripesRanked SurvivesLosses
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2, 3}
    Founders = {1, 2, 3}
    K = 2
    M = 2
    Spans = {1, 2}
    Epochs = {1}
    Values = {1}
    MaxGens = 1
    MaxReads = 2
    MaxChanges = 2
    Faults = {"answer", "evict"}
    MaxFaults = 1
    Bugs = {}
