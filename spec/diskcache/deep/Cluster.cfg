\* MCCluster with two changes to the list, so the fourth host may join and a
\* founder leave, and damaged headers too.
\* Exhaustive, and a minute long. Run by just check-spec-deep.
SPECIFICATION Spec
INVARIANTS NoWrongBytes StripesRanked SurvivesLosses
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2, 3, 4}
    Founders = {1, 2, 3}
    K = 2
    M = 1
    Spans = {1, 2}
    Epochs = {1}
    Values = {1}
    MaxGens = 1
    MaxReads = 1
    MaxChanges = 2
    Faults = {"answer", "damage", "evict"}
    MaxFaults = 1
    Bugs = {}
