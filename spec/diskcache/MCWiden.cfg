\* Three hosts whose deployment widens its code on purpose, from 1+1 to
\* 2+1, while a host may crash or leave, a peer may answer with a wrong
\* stripe, and a stripe may be evicted. A window kept whole on two hosts
\* stays readable after the change, and a read of it fills it under 2+1.
SPECIFICATION Spec
INVARIANTS NoWrongBytes StripesRanked SurvivesLosses
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2, 3}
    Founders = {1, 2, 3}
    K = 1
    M = 1
    NextK = 2
    NextM = 1
    Spans = {1}
    Epochs = {1}
    Values = {1}
    MaxGens = 1
    MaxReads = 3
    MaxChanges = 1
    Faults = {"answer", "evict"}
    MaxFaults = 1
    Bugs = {}
