\* Three hosts and a 2+2 code, so a window's stripes go round the hosts and
\* one host holds two. A host may crash or leave, a peer may answer with a
\* wrong stripe, and a stripe may be evicted.
SPECIFICATION Spec
INVARIANTS NoWrongBytes StripesRanked SurvivesLosses
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2, 3}
    Founders = {1, 2, 3}
    K = 2
    M = 2
    Spans = {1, 2}
    Epochs = {1}
    Values = {1}
    MaxGens = 1
    MaxReads = 2
    MaxChanges = 1
    Faults = {"answer", "evict"}
    MaxFaults = 1
    Bugs = {}
