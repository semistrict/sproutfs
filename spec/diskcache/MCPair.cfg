\* Two hosts and a 1+1 code, the smallest deployment: every window whole on
\* both. Retries carry other bytes, a peer answers wrongly, a header is
\* damaged or a stripe evicted, and a host restarts, leaves and joins.
SPECIFICATION Spec
INVARIANTS NoWrongBytes StripesRanked SurvivesLosses
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2}
    Founders = {1, 2}
    K = 1
    M = 1
    Spans = {1, 2}
    Epochs = {1}
    Values = {1, 2}
    MaxGens = 1
    MaxReads = 2
    MaxChanges = 2
    Faults = {"put", "answer", "damage", "evict"}
    MaxFaults = 2
    Bugs = {}
