\* Four hosts and a 2+1 code. Three found the cluster and the fourth may
\* join, so hosts hold different lists. A host may crash and be marked down,
\* or leave, a peer may answer with a wrong stripe, and a stripe may be
\* evicted.
SPECIFICATION Spec
INVARIANTS NoWrongBytes StripesRanked SurvivesLosses
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2, 3, 4}
    Founders = {1, 2, 3}
    K = 2
    M = 1
    NextK = 0
    NextM = 0
    Spans = {1, 2}
    Epochs = {1}
    Values = {1}
    MaxGens = 1
    MaxReads = 2
    MaxChanges = 1
    Faults = {"answer", "evict"}
    MaxFaults = 1
    Bugs = {}
