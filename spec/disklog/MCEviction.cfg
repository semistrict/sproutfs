\* Eviction is fair, reads keep making stripes hot, and the share falls from
\* three regions to two: the regions the cache holds must fall.
SPECIFICATION LiveSpec
INVARIANT NoWrongBytes
PROPERTY EvictionProgresses
CHECK_DEADLOCK TRUE
CONSTANTS
    Keys = {1, 2, 3, 4}
    Regions = 3
    Slots = 2
    Queue = 2
    ShareMin = 2
    ShareMax = 3
    MaxArrivals = 5
    MaxReads = 1
    MaxShifts = 1
    MaxCrashes = 0
    Overrun = FALSE
    Heat = TRUE
    Bugs = {}
