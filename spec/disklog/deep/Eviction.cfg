\* MCEviction with five stripes and a restart.
\* Exhaustive, and a minute long. Run by just check-spec-deep.
SPECIFICATION LiveSpec
INVARIANT NoWrongBytes
PROPERTY EvictionProgresses
CHECK_DEADLOCK TRUE
CONSTANTS
    Keys = {1, 2, 3, 4, 5}
    Regions = 3
    Slots = 2
    Queue = 2
    ShareMin = 2
    ShareMax = 3
    MaxArrivals = 6
    MaxReads = 1
    MaxShifts = 1
    MaxCrashes = 1
    Overrun = FALSE
    Heat = TRUE
    Bugs = {}
