\* MCLog with two reads, and both a fall in the share and a spent budget.
\* Exhaustive, and a minute long. Run by just check-spec-deep.
SPECIFICATION Spec
INVARIANT NoWrongBytes
CHECK_DEADLOCK TRUE
CONSTANTS
    Keys = {1, 2, 3, 4, 5}
    Regions = 3
    Slots = 2
    Queue = 2
    ShareMin = 2
    ShareMax = 3
    MaxArrivals = 7
    MaxReads = 2
    MaxShifts = 2
    MaxCrashes = 1
    Overrun = TRUE
    Heat = TRUE
    Bugs = {}
