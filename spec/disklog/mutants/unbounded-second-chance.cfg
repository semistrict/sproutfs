\* An unbounded second chance writes every hot stripe of the victim again,
\* over its share too, so a cache whose stripes stay hot never shrinks.
\* expect: EvictionProgresses
SPECIFICATION LiveSpec
INVARIANT NoWrongBytes
PROPERTY EvictionProgresses
CHECK_DEADLOCK TRUE
CONSTANTS
    Keys = {1, 2, 3, 4}
    Regions = 3
    Slots = 2
    Queue = 2
    ShareMin = 2
    ShareMax = 3
    MaxArrivals = 5
    MaxReads = 1
    MaxShifts = 1
    MaxCrashes = 0
    Overrun = FALSE
    Heat = TRUE
    Bugs = {"unbounded-second-chance"}
