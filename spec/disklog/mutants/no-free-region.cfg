\* Eviction without its free region: at its share, the cache must write a
\* hot stripe of the oldest region again before it gives that region back,
\* and has nowhere to write it. The stripe waiting for room waits forever.
\* expect: deadlock
SPECIFICATION Spec
INVARIANT NoWrongBytes
CHECK_DEADLOCK TRUE
CONSTANTS
    Keys = {1, 2, 3, 4, 5}
    Regions = 3
    Slots = 2
    Queue = 2
    ShareMin = 2
    ShareMax = 3
    MaxArrivals = 7
    MaxReads = 1
    MaxShifts = 1
    MaxCrashes = 1
    Overrun = TRUE
    Heat = TRUE
    Bugs = {"no-free-region"}
