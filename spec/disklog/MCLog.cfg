\* Five stripes into three regions of two. Either the share falls from three
\* regions to two or the write budget runs out. Reads make stripes hot, and
\* the host restarts with a torn table.
SPECIFICATION Spec
INVARIANT NoWrongBytes
CHECK_DEADLOCK TRUE
CONSTANTS
    Keys = {1, 2, 3, 4, 5}
    Regions = 3
    Slots = 2
    Queue = 2
    ShareMin = 2
    ShareMax = 3
    MaxArrivals = 7
    MaxReads = 1
    MaxShifts = 1
    MaxCrashes = 1
    Overrun = TRUE
    Heat = TRUE
    Bugs = {}
