\* Put back: the peer takes a batch from an epoch it was fenced past.
\* expect: NoAckedLoss
SPECIFICATION Spec
INVARIANT NoAckedLoss
CHECK_DEADLOCK FALSE
CONSTRAINT FewMessages
CONSTANTS
    Hosts = {a, b, c}
    MaxWrites = 1
    MaxEpoch = 3
    MaxDeaths = 1
    MaxPower = 1
    MaxMessages = 2
    Bugs = {"no-fence"}
