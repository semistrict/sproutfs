\* Put back: a disk acknowledges a batch before it is synced.
\* expect: NoAckedLoss
SPECIFICATION Spec
INVARIANT NoAckedLoss
CHECK_DEADLOCK FALSE
CONSTRAINT FewMessages
CONSTANTS
    Hosts = {a, b, c}
    MaxWrites = 1
    MaxEpoch = 3
    MaxDeaths = 1
    MaxPower = 1
    MaxMessages = 2
    Bugs = {"ack-before-sync"}
