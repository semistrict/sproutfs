\* Put back: the logs drop what the writer holds rather than what the selected checkpoint covers.
\* expect: NoAckedLoss
SPECIFICATION Spec
INVARIANT NoAckedLoss
CHECK_DEADLOCK FALSE
CONSTRAINT FewMessages
CONSTANTS
    Hosts = {a, b, c}
    MaxWrites = 1
    MaxEpoch = 3
    MaxDeaths = 1
    MaxPower = 1
    MaxMessages = 2
    Bugs = {"drop-ahead"}
