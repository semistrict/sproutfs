\* Put back: the writer acknowledges a flush its peer has not synced.
\* expect: NoAckedLoss
SPECIFICATION Spec
INVARIANT NoAckedLoss
CHECK_DEADLOCK FALSE
CONSTRAINT FewMessages
CONSTANTS
    Hosts = {a, b, c}
    MaxWrites = 1
    MaxEpoch = 3
    MaxDeaths = 1
    MaxPower = 1
    MaxMessages = 2
    Bugs = {"local-only"}
