\* Put back: recovery starts the new instance before the state it read is on its own disk.
\* expect: NoAckedLoss
SPECIFICATION Spec
INVARIANT NoAckedLoss
CHECK_DEADLOCK FALSE
CONSTRAINT FewMessages
CONSTANTS
    Hosts = {a, b, c}
    MaxWrites = 1
    MaxEpoch = 3
    MaxDeaths = 1
    MaxPower = 1
    MaxMessages = 2
    Bugs = {"recover-unsynced"}
