\* Three hosts, two writes an instance, two recoveries, one host lost and one
\* power loss of every host, in any order. The whole model is too large to
\* search in a check (one recovery alone, with no failure, passes 13 million
\* states unfinished), so this runs 200,000 seeded random behaviours of up to
\* 60 steps. The mutants are searched whole, under the smaller bounds in
\* their own configurations.
\* tlc: -simulate num=200000 -depth 60 -seed 1
SPECIFICATION Spec
INVARIANT NoAckedLoss
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {a, b, c}
    MaxWrites = 2
    MaxEpoch = 3
    MaxDeaths = 1
    MaxPower = 1
    MaxMessages = 4
    Bugs = {}
