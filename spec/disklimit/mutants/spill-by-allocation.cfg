\* A limiter that counts the sparse spill file by what it has allocated
\* gives the cache space the spill file was promised, and the spill file
\* is refused it.
\* expect: PromisesKept
SPECIFICATION Spec
INVARIANTS PromisesKept GoalKept
CHECK_DEADLOCK FALSE
CONSTANTS
    Cap = 8
    GoalFree = 0
    Promise = 3
    Spill = "sparse"
    OtherMax = 0
    Regions = 8
    Bugs = {"spill-by-allocation"}
