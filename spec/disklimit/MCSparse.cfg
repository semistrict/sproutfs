\* The spill file sparse, as the plan has it: allocated as pages spill and
\* given back as they leave. No other writer shares the filesystem, and the
\* goal leaves nothing free, so that the cache can come closest to the
\* promise.
SPECIFICATION Spec
INVARIANTS PromisesKept GoalKept
CHECK_DEADLOCK FALSE
CONSTANTS
    Cap = 8
    GoalFree = 0
    Promise = 3
    Spill = "sparse"
    OtherMax = 0
    Regions = 8
    Bugs = {}
