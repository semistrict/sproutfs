\* module: Takeover
\* Three hosts and their journal disks, one VM of one page, two stores, two
\* captures and three epochs: migrations with a post-copy, recoveries that
\* read and fence, a host that keeps running after it is fenced or unreachable,
\* a crash, and a detach and a move of a disk.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostFlush
INVARIANT NoFencedReplay
INVARIANT OneWriter
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Hosts = {a, b, c}
    Pages = {p1}
    MaxStores = 2
    MaxEpoch = 3
    MaxEntries = 2
    MaxCrashes = 1
    MaxDetach = 1
    Migrating = TRUE
    Faults = {}
    Bugs = {}
