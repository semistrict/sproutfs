\* module: Capture
\* The seal does not keep the region's unjournaled pages as its list: it
\* write-protects them and forgets them. A flush while the seal stands then
\* misses the stores made just before the seal, and an abandon loses them.
\* This puts back the plan's rule that the seal keeps the unjournaled set. A
\* seal that also leaves the pages in the region's set only takes more, and
\* passes. The Go guard is journal-seal-keeps-unjournaled.
\* expect: NoLostFlush
SPECIFICATION Spec
INVARIANT NoLostFlush
INVARIANT NoRegression
INVARIANT WritableIsUnjournaled
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1, p2}
    Blocks = {b1, b2}
    MaxStores = 3
    MaxPos = 3
    Digests = "keep"
    Bugs = {"seal-drops-unjournaled"}
