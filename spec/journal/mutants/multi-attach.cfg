\* module: Takeover
\* The cloud attaches a journal disk to a second machine while the first
\* still holds it, as a disk set up for several writers would be. The
\* design trusts the cloud's single attach and reads the lease only when a
\* disk is opened, so two hosts can write the disk.
\* expect: OneWriter
SPECIFICATION Spec
INVARIANT NoLostFlush
INVARIANT NoFencedReplay
INVARIANT OneWriter
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Hosts = {a, b}
    Pages = {p1}
    MaxStores = 1
    MaxEpoch = 2
    MaxEntries = 1
    MaxCrashes = 0
    MaxDetach = 0
    Migrating = FALSE
    Faults = {"multi-attach"}
    Bugs = {}
