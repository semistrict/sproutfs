\* module: Capture
\* A failed batch leaves its pages journaled and their digests set. Its
\* entry is not on the disk, and the next capture takes nothing of them, so
\* the next flush that succeeds does not cover the stores the failed one
\* was sent after. This is B6 in spec/bugs.md.
\* expect: NoLostFlush
SPECIFICATION Spec
INVARIANT NoLostFlush
INVARIANT NoRegression
INVARIANT WritableIsUnjournaled
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1, p2}
    Blocks = {b1, b2}
    MaxStores = 3
    MaxPos = 3
    Digests = "keep"
    Bugs = {"failed-keeps-pages"}
