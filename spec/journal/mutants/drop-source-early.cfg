\* module: Takeover
\* A destination's selection drops the source's journal from the list
\* though its checkpoint was sealed before the post-copy was done. That
\* checkpoint lacks the pages the destination had not fetched, so the
\* source's answered flushes are in no journal a replay reads. The guard is
\* journal-drop-source-early.
\* expect: NoLostFlush
SPECIFICATION Spec
INVARIANT NoLostFlush
INVARIANT NoFencedReplay
INVARIANT OneWriter
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Hosts = {a, b}
    Pages = {p1}
    MaxStores = 2
    MaxEpoch = 2
    MaxEntries = 2
    MaxCrashes = 0
    MaxDetach = 0
    Migrating = TRUE
    Faults = {}
    Bugs = {"drop-source-early"}
