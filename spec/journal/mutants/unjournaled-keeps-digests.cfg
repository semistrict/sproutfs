\* module: Capture
\* A page that was unjournaled at a seal keeps its digests. They describe
\* its last entry, not the checkpoint, so a block whose bytes go back to
\* that entry's after the selection is skipped, and the replay reads the
\* checkpoint's bytes. The guard is journal-digests-survive-unjournaled-seal.
\* expect: NoLostFlush
SPECIFICATION Spec
INVARIANT NoLostFlush
INVARIANT NoRegression
INVARIANT WritableIsUnjournaled
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1, p2}
    Blocks = {b1, b2}
    MaxStores = 3
    MaxPos = 3
    Digests = "keep"
    Bugs = {"unjournaled-keeps-digests"}
