\* module: Capture
\* A protect trap on a page no seal holds takes the protection off and does
\* not mark the page unjournaled. The guard is journal-trap-not-marked.
\* expect: WritableIsUnjournaled
SPECIFICATION Spec
INVARIANT NoLostFlush
INVARIANT NoRegression
INVARIANT WritableIsUnjournaled
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1, p2}
    Blocks = {b1, b2}
    MaxStores = 3
    MaxPos = 3
    Digests = "keep"
    Bugs = {"trap-not-marked"}
