\* module: Takeover
\* A replay takes a named journal's entries of any epoch after the covered
\* position. A VM that migrates back to a host it ran on reads its older
\* entries there over the newer checkpoint. The guard is
\* journal-replay-any-epoch.
\* expect: NoFencedReplay
SPECIFICATION Spec
INVARIANT NoLostFlush
INVARIANT NoFencedReplay
INVARIANT OneWriter
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Hosts = {a, b}
    Pages = {p1}
    MaxStores = 2
    MaxEpoch = 3
    MaxEntries = 2
    MaxCrashes = 0
    MaxDetach = 0
    Migrating = TRUE
    Faults = {}
    Bugs = {"replay-any-epoch"}
