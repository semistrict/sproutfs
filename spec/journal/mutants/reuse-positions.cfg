\* module: Capture
\* After a failed batch the writer gives its positions out again. The failed
\* entry, which landed, then lies after the covered position of the next
\* seal, though that checkpoint holds newer bytes, and a replay over it
\* applies the older entry.
\* expect: NoRegression
SPECIFICATION Spec
INVARIANT NoLostFlush
INVARIANT NoRegression
INVARIANT WritableIsUnjournaled
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1, p2}
    Blocks = {b1, b2}
    MaxStores = 3
    MaxPos = 3
    Digests = "keep"
    Bugs = {"reuse-positions"}
