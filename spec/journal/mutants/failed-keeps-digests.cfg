\* module: Capture
\* A failed batch gives its pages back as unjournaled but keeps their
\* digests. They describe an entry that may not be on the disk, so the next
\* capture skips the blocks that entry held. This is B6 in spec/bugs.md.
\* expect: NoLostFlush
SPECIFICATION Spec
INVARIANT NoLostFlush
INVARIANT NoRegression
INVARIANT WritableIsUnjournaled
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1, p2}
    Blocks = {b1, b2}
    MaxStores = 3
    MaxPos = 3
    Digests = "keep"
    Bugs = {"failed-keeps-digests"}
