\* module: Takeover
\* The holder of a journal disk answers a recovery's read without fencing
\* the VM. A host that still runs it answers a flush after the read, and the
\* recovered VM's checkpoint does not hold it. The guard is
\* journal-read-without-fence.
\* expect: NoLostFlush
SPECIFICATION Spec
INVARIANT NoLostFlush
INVARIANT NoFencedReplay
INVARIANT OneWriter
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Hosts = {a, b}
    Pages = {p1}
    MaxStores = 2
    MaxEpoch = 2
    MaxEntries = 2
    MaxCrashes = 0
    MaxDetach = 0
    Migrating = FALSE
    Faults = {}
    Bugs = {"read-no-fence"}
