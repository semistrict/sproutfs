\* module: Capture
\* Two pages of two blocks, three stores and three positions, with any
\* number of seals and failed batches. A page that was not unjournaled at a
\* seal keeps its digests, and a selection gives each page still on the seal's
\* list the digests of the selected bytes, as vmmemory/journal.go does.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostFlush
INVARIANT NoRegression
INVARIANT WritableIsUnjournaled
INVARIANT DigestsDescribeTheJournal
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1, p2}
    Blocks = {b1, b2}
    MaxStores = 3
    MaxPos = 3
    Digests = "refresh"
    Bugs = {}
