\* module: Capture
\* Two pages of one block, four stores and four positions, with any number
\* of seals and failed batches. Run by just check-spec-deep.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostFlush
INVARIANT NoRegression
INVARIANT WritableIsUnjournaled
INVARIANT DigestsDescribeTheJournal
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1, p2}
    Blocks = {b1}
    MaxStores = 4
    MaxPos = 4
    Digests = "keep"
    Bugs = {}
