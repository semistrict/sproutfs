\* module: Capture
\* MCCapture's bounds with the rule the plan falls back to: every digest is
\* dropped at every seal. It passes too; MCCapture shows the digests of a
\* page that was not unjournaled at a seal can be kept. Run by just
\* check-spec-deep.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostFlush
INVARIANT NoRegression
INVARIANT WritableIsUnjournaled
INVARIANT DigestsDescribeTheJournal
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1, p2}
    Blocks = {b1, b2}
    MaxStores = 3
    MaxPos = 3
    Digests = "drop"
    Bugs = {}
