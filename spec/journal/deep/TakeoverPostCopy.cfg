\* module: Takeover
\* Three hosts and a VM of two pages, three stores, three epochs, no crash
\* or detach: a destination's checkpoint sealed with some pages fetched and
\* some not. Run by just check-spec-deep.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostFlush
INVARIANT NoFencedReplay
INVARIANT OneWriter
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Hosts = {a, b, c}
    Pages = {p1, p2}
    MaxStores = 3
    MaxEpoch = 3
    MaxEntries = 2
    MaxCrashes = 0
    MaxDetach = 0
    Migrating = TRUE
    Faults = {}
    Bugs = {}
