\* module: Capture
\* One page of two blocks, four stores and four positions, with any number
\* of seals and failed batches. Run by just check-spec-deep.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostFlush
INVARIANT NoRegression
INVARIANT WritableIsUnjournaled
INVARIANT DigestsDescribeTheJournal
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1}
    Blocks = {b1, b2}
    MaxStores = 4
    MaxPos = 4
    Digests = "keep"
    Bugs = {}
