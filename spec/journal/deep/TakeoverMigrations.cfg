\* module: Takeover
\* Three hosts, four epochs and three captures, no crash or detach:
\* migrations and recoveries in any order, a VM that comes back to a host it
\* ran on, and recoveries during a post-copy. Run by just check-spec-deep.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostFlush
INVARIANT NoFencedReplay
INVARIANT OneWriter
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Hosts = {a, b, c}
    Pages = {p1}
    MaxStores = 2
    MaxEpoch = 4
    MaxEntries = 3
    MaxCrashes = 0
    MaxDetach = 0
    Migrating = TRUE
    Faults = {}
    Bugs = {}
