\* module: Capture
\* One page of three blocks, four stores and three positions, with any
\* number of seals and failed batches. Run by just check-spec-deep.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostFlush
INVARIANT NoRegression
INVARIANT WritableIsUnjournaled
INVARIANT DigestsDescribeTheJournal
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1}
    Blocks = {b1, b2, b3}
    MaxStores = 4
    MaxPos = 3
    Digests = "keep"
    Bugs = {}
