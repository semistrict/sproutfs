\* module: Takeover
\* Three hosts, no migration, four epochs: recoveries one after another,
\* with a crash, a detach and a move of a disk, and fenced hosts that keep
\* running. Run by just check-spec-deep.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostFlush
INVARIANT NoFencedReplay
INVARIANT OneWriter
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Hosts = {a, b, c}
    Pages = {p1}
    MaxStores = 2
    MaxEpoch = 4
    MaxEntries = 2
    MaxCrashes = 1
    MaxDetach = 1
    Migrating = FALSE
    Faults = {}
    Bugs = {}
