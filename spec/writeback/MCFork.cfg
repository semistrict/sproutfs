\* MCWriteback where a seal may be a fork point's: it is not settled, and its
\* children read its pages until it is retired or abandoned.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT SealedBytes
INVARIANT NoLostWrite
INVARIANT Reserved
INVARIANT Budget
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1, p2}
    Slots = {s1, s2, s3}
    None = None
    MaxStores = 3
    MaxSeals = 2
    Forks = TRUE
    Bugs = {}
