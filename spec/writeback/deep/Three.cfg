\* Three pages, a budget of four reservations, four stores, two checkpoints,
\* and fork points. Run by just check-spec-deep.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT SealedBytes
INVARIANT NoLostWrite
INVARIANT Reserved
INVARIANT Budget
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1, p2, p3}
    Slots = {s1, s2, s3, s4}
    None = None
    MaxStores = 4
    MaxSeals = 2
    Forks = TRUE
    Bugs = {}
