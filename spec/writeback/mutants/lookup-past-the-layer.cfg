\* The lookup before 2026-10-08 put back: a fault that let its own resident
\* page's lock go before its lookup bound the volume's page once an eviction
\* had spilled the guest's. docs/vm-memory.md, A fault refaults its own page
\* that was spilled before its lookup. The binding also keeps the reservation
\* that holds the guest's bytes, which Reserved catches too; it is left out
\* here, so that TLC's workers, which may reach either first, report one.
\* expect: NoLostWrite
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT SealedBytes
INVARIANT NoLostWrite
INVARIANT Budget
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1, p2}
    Slots = {s1, s2, s3}
    None = None
    MaxStores = 3
    MaxSeals = 2
    Forks = FALSE
    Bugs = {"lookup-past-the-layer"}
