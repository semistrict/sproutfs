\* The walk skips a page a reclaim holds instead of joining the reclaim. The
\* pause took the page out of the dirty set, so neither this checkpoint nor
\* the next takes the guest's write.
\* expect: NoLostWrite
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT SealedBytes
INVARIANT NoLostWrite
INVARIANT Reserved
INVARIANT Budget
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1, p2}
    Slots = {s1, s2, s3}
    None = None
    MaxStores = 3
    MaxSeals = 2
    Forks = FALSE
    Bugs = {"seal-skips-reclaim"}
