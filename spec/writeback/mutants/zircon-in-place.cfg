\* Zircon's rule put back in place of D1: a store into a page a checkpoint
\* holds makes it Dirty in place, so the upload reads bytes from after the
\* pause.
\* expect: SealedBytes
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT SealedBytes
INVARIANT NoLostWrite
INVARIANT Reserved
INVARIANT Budget
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTANTS
    Pages = {p1, p2}
    Slots = {s1, s2, s3}
    None = None
    MaxStores = 3
    MaxSeals = 2
    Forks = FALSE
    Bugs = {"zircon-in-place"}
