\* A disk is assigned to another host while its member still serves it: the
\* member, which has not read the change, serves it beside the new one. The
\* Go guard is membership-assign-without-release.
\* expect: OneServer
SPECIFICATION Spec
INVARIANTS OneMembership NoRegress OneServer
CHECK_DEADLOCK FALSE
CONSTANTS
    N = 2
    MaxGen = 5
    MaxCrashes = 1
    Bugs = {"assign-without-release"}
