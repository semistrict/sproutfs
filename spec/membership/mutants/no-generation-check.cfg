\* A holder answers under whatever generation its copy holds: a request
\* ahead of it is not read up to, and one behind it is not told it is
\* stale. The holder serves a stripe under a membership the sender does not
\* hold. The Go guard is membership-serve-stale-generation.
\* expect: OneMembership
SPECIFICATION Spec
INVARIANTS OneMembership NoRegress OneServer
CHECK_DEADLOCK FALSE
CONSTANTS
    N = 2
    MaxGen = 5
    MaxCrashes = 1
    Bugs = {"no-generation-check"}
