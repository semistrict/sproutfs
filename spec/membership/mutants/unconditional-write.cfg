\* A writer writes the generation after the one it read whatever the object
\* holds now: a change another writer made since is lost, and the
\* generation goes back. The Go guard is membership-write-unconditional.
\* expect: NoRegress
SPECIFICATION Spec
INVARIANTS OneMembership NoRegress OneServer
CHECK_DEADLOCK FALSE
CONSTANTS
    N = 2
    MaxGen = 5
    MaxCrashes = 1
    Bugs = {"unconditional-write"}
