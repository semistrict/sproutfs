\* Two hosts, each with one disk, and a controller: any of the three writes
\* the membership, a disk moves between the hosts through release, and a
\* host may die. Every request and keep is delivered to either host.
SPECIFICATION Spec
INVARIANTS OneMembership NoRegress OneServer
CHECK_DEADLOCK FALSE
CONSTANTS
    N = 2
    MaxGen = 6
    MaxCrashes = 1
    Bugs = {}
