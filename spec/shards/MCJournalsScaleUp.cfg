\* module: Journals
\* A machine joins an empty pool: controllers acting on old generations
\* create one or two disks, add them, reserve one, attach it while the host
\* boots, and assign it; the host writes it, and may die or leave; a spare
\* disk is deleted, and removed once the cloud no longer lists it.
SPECIFICATION Spec
INVARIANTS TypeOK OneHolder NoStaleWrite WriterOnItsMachine EmptyIsTrue NoLiveReuse NoLiveDelete AttachedOnce ListedExists Converges
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "bare"
    Hosts = {1}
    Again = {}
    Disks = {1, 2}
    Later = {1}
    MaxGen = 11
    MaxLosses = 1
    MaxLeaves = 1
    Bugs = {}
