\* module: Journals
\* Two machines, each with a host writing its own journal disk, over nine
\* generations: either host may be lost and its disk read by the other,
\* and a freed disk reserved for the other machine or deleted.
SPECIFICATION Spec
INVARIANTS TypeOK OneHolder NoStaleWrite WriterOnItsMachine EmptyIsTrue NoLiveReuse NoLiveDelete AttachedOnce ListedExists Converges
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "running"
    Hosts = {1, 2}
    Again = {}
    Disks = {1, 2}
    Later = {}
    MaxGen = 9
    MaxLosses = 1
    MaxLeaves = 1
    Bugs = {}
