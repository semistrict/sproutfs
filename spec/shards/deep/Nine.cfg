\* module: Shards
\* Three hosts, two of them on one machine, over nine generations, two of
\* which may die: the shard moves round all three, and back.
SPECIFICATION Spec
INVARIANTS OneServer OneOpenerAMachine NoStaleWrite
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2, 3}
    Shared = {1, 2}
    MaxGen = 9
    MaxCrashes = 2
    Faults = {}
    Bugs = {}
