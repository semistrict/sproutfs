\* module: Journals
\* MCJournals over fourteen generations: a lost host's disk is read, freed,
\* reserved for the survivor's machine or the next host of its own, and
\* written again.
SPECIFICATION Spec
INVARIANTS TypeOK OneHolder NoStaleWrite WriterOnItsMachine EmptyIsTrue NoLiveReuse NoLiveDelete AttachedOnce ListedExists Converges
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "running"
    Hosts = {1, 2, 3}
    Again = {3}
    Disks = {1}
    Later = {}
    MaxGen = 14
    MaxLosses = 1
    MaxLeaves = 1
    Bugs = {}
