\* module: Journals
\* Two machines, each with a host writing its own journal disk, one disk
\* and a host that may start on machine 1 after the first dies: a host
\* dies, goes quiet or starts again, a machine leaves the pool, and the
\* controller acts on the cloud from old generations. The disk is read by
\* the survivor, marked empty, freed and deleted, or written by the next
\* host of its machine.
SPECIFICATION Spec
INVARIANTS TypeOK OneHolder NoStaleWrite WriterOnItsMachine EmptyIsTrue NoLiveReuse NoLiveDelete AttachedOnce ListedExists Converges
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "running"
    Hosts = {1, 2, 3}
    Again = {3}
    Disks = {1}
    Later = {}
    MaxGen = 8
    MaxLosses = 1
    MaxLeaves = 1
    Bugs = {}
