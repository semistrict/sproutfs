\* module: Journals
\* Part 1 of the fix of B7 undone: a host reports its own disk
\* empty whenever it runs no VM, as commit 130a2b85 does, before it has read
\* that the disk is released. The controller drains the host and marks the
\* disk empty from that report, the host, which has not read the drain,
\* takes a VM, which flushes, and the disk is deleted with that entry once
\* the host is gone.
\* expect: NoLiveDelete
SPECIFICATION Spec
INVARIANTS NoLiveDelete
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "running"
    Hosts = {1, 2}
    Again = {}
    Disks = {1}
    Later = {}
    MaxGen = 8
    MaxLosses = 1
    MaxLeaves = 1
    Bugs = {"report-before-release"}
