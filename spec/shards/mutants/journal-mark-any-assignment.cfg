\* module: Journals
\* Part 3 of the fix of B7 undone: the controller marks a disk
\* empty on its holder's report whatever assignment the holder holds it
\* under, as a report that names only the disk does. A host still holds the
\* disk it read under an older assignment, from a membership it read before
\* the disk was let go and assigned to it again as its own; its report as a
\* reader marks the disk it is now to write.
\* expect: EmptyIsTrue
SPECIFICATION Spec
INVARIANTS EmptyIsTrue
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "running"
    Hosts = {1, 2}
    Again = {}
    Disks = {1}
    Later = {}
    MaxGen = 14
    MaxLosses = 1
    MaxLeaves = 1
    Bugs = {"mark-any-assignment"}
