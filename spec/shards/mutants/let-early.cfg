\* module: Shards
\* A shard is let go as soon as it is released, before its host has closed
\* it and the cloud has detached it, under a cloud that attaches it to a
\* second machine: the host that served it, which has not read the release,
\* serves it beside the new member. Under a single-writer cloud the same
\* defect is carried by the cloud refusing the second attach until a detach
\* has taken the device from the first host. The Go guards are
\* membership-let-attached-shard and membership-detach-held-shard.
\* expect: OneServer
SPECIFICATION Spec
INVARIANTS OneServer OneOpenerAMachine NoStaleWrite
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2}
    Shared = {}
    MaxGen = 6
    MaxCrashes = 0
    Faults = {"multi-attach"}
    Bugs = {"let-early"}
