\* module: Journals
\* Part 2 of the fix of B7 undone: a host takes a VM while the
\* membership it holds releases its own disk, as the orchestrator placed it
\* from an older membership. The VM flushes after the disk was marked
\* empty, the host dies before it reports the live entry, the disk is let
\* go marked empty, and it is deleted with that entry.
\* expect: NoLiveDelete
SPECIFICATION Spec
INVARIANTS NoLiveDelete
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "running"
    Hosts = {1, 2}
    Again = {}
    Disks = {1}
    Later = {}
    MaxGen = 8
    MaxLosses = 1
    MaxLeaves = 1
    Bugs = {"place-on-releasing"}
