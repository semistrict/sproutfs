\* module: Journals
\* A free disk is reserved for a machine whether or not it is empty: the
\* disk of a host lost with live entries goes to another machine's host
\* before anyone reads them.
\* expect: NoLiveReuse
SPECIFICATION Spec
INVARIANTS NoLiveReuse
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "running"
    Hosts = {1, 2}
    Again = {}
    Disks = {1}
    Later = {}
    MaxGen = 6
    MaxLosses = 1
    MaxLeaves = 1
    Bugs = {"reserve-not-empty"}
