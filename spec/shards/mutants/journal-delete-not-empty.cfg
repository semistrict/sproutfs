\* module: Journals
\* A free disk is marked deleting whether or not it is empty: the disk of a
\* host lost with live entries is deleted before anyone reads them.
\* expect: NoLiveDelete
SPECIFICATION Spec
INVARIANTS NoLiveDelete
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "running"
    Hosts = {1, 2}
    Again = {}
    Disks = {1}
    Later = {}
    MaxGen = 6
    MaxLosses = 1
    MaxLeaves = 1
    Bugs = {"delete-not-empty"}
