\* module: Journals
\* B8: a controller adds a disk from a list of the cloud's disks it read
\* before a compare-and-set it lost, over a newer generation in which
\* another controller has deleted that disk and removed it. The membership
\* then offers a disk that does not exist.
\* expect: ListedExists
SPECIFICATION Spec
INVARIANTS ListedExists
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "spare"
    Hosts = {1}
    Again = {}
    Disks = {1, 2}
    Later = {}
    MaxGen = 5
    MaxLosses = 0
    MaxLeaves = 0
    Bugs = {"stale-list"}
