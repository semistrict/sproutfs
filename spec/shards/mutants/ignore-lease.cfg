\* module: Shards
\* A host that holds a shard another member took writes a region of it,
\* not reading the lease first, and opens a shard under an assignment older
\* than the lease. The Go guard is shard-ignore-lease.
\* expect: NoStaleWrite
SPECIFICATION Spec
INVARIANTS NoStaleWrite
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2}
    Shared = {}
    MaxGen = 6
    MaxCrashes = 0
    Faults = {"multi-attach"}
    Bugs = {"let-early", "ignore-lease"}
