\* Two hosts on two machines, under a cloud that may attach the shard to a
\* second machine while it is attached to the first. A shard is let go only
\* once the cloud has it on no machine, so the host that served it has lost
\* the device before another is assigned it, and the lease fences any write
\* the first could still try.
SPECIFICATION Spec
INVARIANTS OneServer OneOpenerAMachine NoStaleWrite
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2}
    Shared = {}
    MaxGen = 8
    MaxCrashes = 1
    Faults = {"multi-attach"}
    Bugs = {}
