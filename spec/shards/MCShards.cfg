\* module: Shards
\* Three hosts, two of them on one machine, one shard, and a controller
\* that acts on the cloud from stale snapshots, over eight generations: the
\* shard moves between machines and between the two hosts of one machine,
\* while a host may die with it open and reports arrive late.
SPECIFICATION Spec
INVARIANTS OneServer OneOpenerAMachine NoStaleWrite
CHECK_DEADLOCK FALSE
CONSTANTS
    Hosts = {1, 2, 3}
    Shared = {1, 2}
    MaxGen = 8
    MaxCrashes = 1
    Faults = {}
    Bugs = {}
