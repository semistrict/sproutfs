edition = "2024";

package sproutfs.checkpoint.v1;

option go_package = "github.com/semistrict/sproutfs/checkpoint/internal/gen/sproutfs/checkpoint/v1;checkpointv1";

// Root is what one published checkpoint says about itself: every volume's
// segments, the checkpoints it reads from, and where the VMM state is. It is
// the last thing in that checkpoint's index object, whose header carries the
// format version and whose key names the VM and the sequence: the root carries
// neither. It inherits nothing at read time — a root is complete on its own,
// and no reader opens another.
message Root {
  reserved 1;  // The index format version, before the header carried it.
  repeated Volume volumes = 2;
  // Checkpoints names every checkpoint this root names: the ones whose parts it
  // reads a page or the state from, the ones whose index objects hold a segment
  // it addresses, itself, and the ones its own compaction emptied and only
  // spares — so reclamation and compaction read no other root. A fork's entries
  // name its parent's checkpoints, which is how a fork costs nothing.
  repeated Checkpoint checkpoints = 3;
  // The VMM state's member, when the checkpoint saved one. A zero length means
  // it saved none.
  uint32 state_checkpoint = 4;
  uint32 state_part = 5;
  uint64 state_offset = 6;
  uint64 state_length = 7;
  // Origins names the checkpoints the state member was first published under,
  // for a state compaction has moved out of the checkpoint that published it.
  // Pages carry theirs in the segment that locates them.
  repeated Ref origins = 8;
  // State_origin is one past the position of the state's origin in origins.
  // Zero means the state still lives in the checkpoint that published it.
  uint32 state_origin = 9;
  // Vcpus is how many processors a boot of this checkpoint gives the guest.
  // A restore takes the count from the VMM state instead. Zero records none,
  // and the host's default applies. A root carries its parent's, so a fork
  // and every later checkpoint of a VM keep the count it was created with.
  uint32 vcpus = 10;
}

// Ref names one checkpoint: the VM that published it and its sequence.
message Ref {
  string vm = 1;
  uint64 sequence = 2;
}

// Volume is one named byte-addressed device. Its page table is split into
// segments of a fixed number of pages each, ordered by number and sparse: a
// segment with no entry holds no pages, and every page of it reads as zeroes.
message Volume {
  string name = 1;
  uint64 size = 2;
  reserved 3;  // The whole page table, before it was split into segments.
  repeated SegmentEntry segments = 4;
  // The volume's page geometry: how large one of its pages is, which is the
  // unit of publication and what its page numbers count, and how many of those
  // pages one segment of its page table covers. It is chosen when the volume is
  // created and never changes, and it is recorded rather than derived: a reader
  // divides page numbers by what is here, never by a constant of its own.
  uint64 page_size = 5;
  uint64 segment_pages = 6;
  // Ephemeral marks a volume no checkpoint holds: an ephemeral disk. It has no
  // segments in any root, and none of its pages is a member of any part. The
  // root records only its name, its size and its page size, which is what a VM
  // opened at this checkpoint recreates it from, zeroed. A root written before
  // the field existed marks no volume ephemeral.
  bool ephemeral = 7;
}

// SegmentEntry addresses one segment of a volume's page table. A segment is
// identified by the checkpoint that wrote it, this volume and the number here,
// the way a page is identified by its origin; the offset and length are only
// where to fetch it inside that checkpoint's index object, so one fetch is one
// range get. A checkpoint that did not change a segment addresses the one an
// earlier checkpoint wrote, exactly as a page entry does.
message SegmentEntry {
  uint64 number = 1;
  uint32 checkpoint = 2;
  reserved 3;  // The part, before a segment left the parts.
  uint64 offset = 4;
  uint64 length = 5;
  // Reads names every checkpoint this segment's page entries locate a member in
  // and how many bytes they hold there, so the root alone answers both what
  // this checkpoint reads from and what each checkpoint's parts are still read
  // for. Nothing has to open a segment to find out either.
  repeated CheckpointUse reads = 6;
}

// CheckpointUse is what one segment's page entries read from one checkpoint's
// parts: the checkpoint's position in the root's list, and the sum of the member
// lengths those entries name in it. The sums are computed when the segment is
// encoded, and a segment is encoded whenever its entries change, so they never
// go stale.
message CheckpointUse {
  uint32 checkpoint = 1;
  uint64 bytes = 2;
}

// Segment is one range of a volume's page table, written into the index object
// of the checkpoint that changed it. It is complete on its own: each page names
// its checkpoint and its origin by position in the segment's own lists, and its
// number relative to the segment's first page, so a segment can be read without
// its root.
message Segment {
  repeated Page pages = 1;
  repeated Ref checkpoints = 2;
  repeated Ref origins = 3;
}

// Page locates one page's current bytes: the checkpoint that holds them, by
// position in its segment's checkpoint list, the part of that checkpoint, and
// the encoded member's extent within the part.
message Page {
  // Number is the page's number relative to its segment's first page.
  uint32 number = 1;
  uint32 checkpoint = 2;
  uint32 part = 3;
  uint64 offset = 4;
  uint64 length = 5;
  // Origin is one past the position of this page's origin in its segment's
  // origins list. Zero means the page still lives in the checkpoint that
  // published it, which is every page compaction has not moved.
  uint32 origin = 6;
}

// Checkpoint is one checkpoint a root names: whose it is, how many parts it
// has, and how many encoded member bytes they hold, which is what compaction
// measures liveness against. A checkpoint of no parts — a new VM's root, or one
// this root names only because a segment lives in its index object — states
// zero of both.
message Checkpoint {
  string vm = 1;
  uint64 sequence = 2;
  uint32 parts = 3;
  uint64 bytes = 4;
  // Emptied is the sequence of the checkpoint whose compaction left nothing in
  // this root reading from this one's parts. The root names it anyway, for that
  // one checkpoint, because a reader still holding the view this one replaced
  // does read from it; the next checkpoint drops it and reclamation deletes it.
  uint64 emptied = 5;
}

// PartTable is the table every part ends with, before its fixed trailer. It
// lists that part's members in the order they were written, so a part says what
// it holds whether or not the root naming those members is at hand.
message PartTable {
  repeated Member members = 1;
  // The part layout this table was written under, checked against the one the
  // reader implements. The trailer carries it too, so a part is refused before
  // its table is parsed.
  uint32 format_version = 2;
}

// Member is one entry of a part: the page or the VMM state it holds, and where
// in the part its encoded bytes are. Those are the two kinds a part holds; the
// state member leaves volume empty.
message Member {
  string volume = 1;
  uint64 page = 2;
  uint64 offset = 3;
  uint64 length = 4;
  bool state = 5;
  // Origin is the checkpoint this member's page was first published under,
  // which is its page identity. It is written only when compaction moved the
  // page out of the checkpoint that published it; empty names the checkpoint
  // holding it.
  string origin_vm = 6;
  uint64 origin_sequence = 7;
  reserved 8;   // The tombstone of a page published as zeroes, before a page a
                // checkpoint zeroed was simply absent from the segment that
                // checkpoint rewrote.
  reserved 9;   // The segment member, before segments left the parts.
  reserved 10;  // The root member, before the root left the parts.
}
