edition = "2024";

package sproutfs.migrate.v1;

option go_package = "github.com/semistrict/sproutfs/vmmigrate/internal/gen/sproutfs/migrate/v1;migratev1";

// Status is why a page server answered as it did. Only STATUS_OK carries pages;
// STATUS_UNKNOWN_VM is the answer that sends a destination to its volume for
// good, because it means this host no longer serves that VM at all.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  // STATUS_UNKNOWN_VM reports a VM this host does not serve, which is either a
  // migration it never held or one it has already released.
  STATUS_UNKNOWN_VM = 2;
  // STATUS_UNKNOWN_VOLUME reports a VM this host serves without that memory region.
  STATUS_UNKNOWN_VOLUME = 3;
  STATUS_INVALID_REQUEST = 4;
  // STATUS_BUSY reports the per-peer budget, and is retryable.
  STATUS_BUSY = 5;
  STATUS_INTERNAL = 6;
}

// PageRequest asks one memory region of one VM for a run of consecutive pages. The
// server bounds count itself and answers a longer run with what it will serve.
message PageRequest {
  string vm = 1;
  string volume = 2;
  uint64 first_page = 3;
  uint32 count = 4;
  // Required encoding version: 1 denotes an independent bounded blob envelope.
  uint32 payload_format = 5;
}

// PageResponse answers with the pages this host holds. present has one bit per
// requested page, least significant bit of byte i/8 first, set for a page whose
// bytes follow; the payload is a bounded raw-or-Zstandard blob that decodes
// to exactly those pages in ascending page order. A page whose bit is clear is one the
// destination reads from its own volume.
message PageResponse {
  Status status = 1;
  bytes present = 2;
  uint32 page_size = 3;
  // count echoes how many pages the bitmap describes, which may be fewer than
  // the request asked for.
  uint32 count = 4;
  // Required encoding version: 1 denotes an independent bounded blob envelope.
  uint32 payload_format = 5;
  // dirty has the same shape as present and is set for a served page this host
  // holds as its own state, which no checkpoint of the VM has. The destination
  // must keep such a page dirty in its own pager, so its next checkpoint
  // publishes it; a served page whose bit is clear is the selected
  // checkpoint's own bytes.
  bytes dirty = 6;
}

// PageRun is a half-open run of count consecutive pages.
message PageRun {
  uint64 first_page = 1;
  uint32 count = 2;
}

// ResidentRequest asks for the pages one memory region holds, from first_page on. The
// listing is bounded, so a destination walks a large memory region with several
// requests rather than one unbounded reply.
message ResidentRequest {
  string vm = 1;
  string volume = 2;
  uint64 first_page = 3;
  uint32 max_runs = 4;
}

// ResidentResponse lists that memory region's resident runs in ascending order. more
// reports that the memory region holds pages above the last run returned, which the
// next request asks for.
message ResidentResponse {
  Status status = 1;
  repeated PageRun runs = 2;
  uint32 page_size = 3;
  bool more = 4;
}
